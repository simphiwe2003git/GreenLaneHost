<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Green Lane 101 | Premium Trucking & Logistics</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- React and Babel for single-file JSX support -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom": "https://esm.sh/react-dom@^19.2.3",
    "react-dom/client": "https://esm.sh/react-dom@^19.2.3/client",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/"
  }
}
</script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#006400',
                        secondary: '#002147',
                        accent: '#32CD32',
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    animation: {
                        'float': 'float 15s infinite linear',
                        'pulse-slow': 'pulse 3s infinite',
                        'fadeInUp': 'fadeInUp 0.8s ease-out forwards',
                    },
                    keyframes: {
                        float: {
                            '0%': { transform: 'translate(0, 0) rotate(0deg)' },
                            '25%': { transform: 'translate(-30px, -30px) rotate(90deg)' },
                            '50%': { transform: 'translate(0, -60px) rotate(180deg)' },
                            '75%': { transform: 'translate(30px, -30px) rotate(270deg)' },
                            '100%': { transform: 'translate(0, 0) rotate(360deg)' },
                        },
                        fadeInUp: {
                            '0%': { opacity: '0', transform: 'translateY(30px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        }
                    }
                }
            }
        }
    </script>
    <style>
        html { scroll-behavior: smooth; }
        .delay-200 { animation-delay: 0.2s; }
        .delay-300 { animation-delay: 0.3s; }
        .delay-500 { animation-delay: 0.5s; }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 font-sans">
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import React, { useState } from 'react';
        import ReactDOM from 'react-dom/client';

        const DEFAULT_LOGO = 'IMG-20251018-WA0005 (003).jpg';

        // --- Header Component ---
        const Header = ({ logo }) => {
            const [isMenuOpen, setIsMenuOpen] = useState(false);
            const navLinks = [
                { name: 'Home', href: '#home' },
                { name: 'Services', href: '#categories' },
                { name: 'Fleet', href: '#brands' },
                { name: 'Leadership', href: '#leadership' },
                { name: 'Reviews', href: '#reviews' },
                { name: 'FAQ', href: '#faq' },
                { name: 'Location', href: '#location' },
                { name: 'Contact', href: '#contact' },
            ];
            return (
                <header className="sticky top-0 z-[1000] bg-gradient-to-r from-primary to-secondary text-white shadow-lg py-3">
                    <div className="container mx-auto px-4 flex justify-between items-center">
                        <div className="flex items-center gap-4">
                            <img src={logo} alt="Green Lane 101" className="h-14 w-auto object-contain animate-pulse-slow" />
                            <div className="hidden sm:block">
                                <h1 className="text-xl font-bold leading-tight">Green <span className="text-accent">Lane</span> 101</h1>
                                <p className="text-[10px] opacity-80 uppercase tracking-widest">Trucking & Logistics</p>
                            </div>
                        </div>
                        <button className="md:hidden text-2xl focus:outline-none" onClick={() => setIsMenuOpen(!isMenuOpen)}>
                            <i className={`fas ${isMenuOpen ? 'fa-times' : 'fa-bars'}`}></i>
                        </button>
                        <nav className={`${isMenuOpen ? 'flex' : 'hidden'} md:flex absolute md:relative top-full left-0 w-full md:w-auto bg-secondary md:bg-transparent flex-col md:flex-row p-4 md:p-0 space-y-4 md:space-y-0 md:space-x-6 shadow-xl md:shadow-none`}>
                            {navLinks.map((link) => (
                                <a key={link.name} href={link.href} className="text-sm font-medium hover:text-accent transition-all relative after:content-[''] after:absolute after:bottom-[-4px] after:left-0 after:w-0 after:h-[2px] after:bg-accent after:transition-all hover:after:w-full" onClick={() => setIsMenuOpen(false)}>
                                    {link.name}
                                </a>
                            ))}
                        </nav>
                    </div>
                </header>
            );
        };

        // --- Hero Component ---
        const Hero = () => {
            return (
                <section id="home" className="relative overflow-hidden py-32 md:py-48 text-white text-center">
                    <div className="absolute inset-0 z-0 bg-cover bg-center bg-fixed" style={{ backgroundImage: "linear-gradient(rgba(0, 100, 0, 0.85), rgba(0, 33, 71, 0.85)), url('https://images.pexels.com/photos/34365732/pexels-photo-34365732.jpeg')" }} />
                    <div className="absolute inset-0 z-0 opacity-20 pointer-events-none animate-float">
                        <svg width="100%" height="100%" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" className="w-full h-full">
                            <path d="M11 18c3.866 0 7-3.134 7-7s-3.134-7-7-7-7 3.134-7 7 3.134 7 7 7zm48 25c3.866 0 7-3.134 7-7s-3.134-7-7-7-7 3.134-7 7 3.134 7 7 7zm-43-7c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zm63 31c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zM34 90c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zm56-76c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zM12 86c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm28-65c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm23-11c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm-6 60c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm29 22c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zM32 63c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm57-13c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm-9-21c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM60 91c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM35 41c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM12 60c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2z" fill="#32CD32" />
                        </svg>
                    </div>
                    <div className="container mx-auto px-4 relative z-10 max-w-4xl">
                        <h1 className="text-4xl md:text-6xl font-extrabold mb-6 drop-shadow-lg leading-tight animate-fadeInUp">
                            Professional Trucking & <span className="text-accent">Logistics Solutions</span>
                        </h1>
                        <p className="text-lg md:text-xl mb-10 text-white/90 drop-shadow animate-fadeInUp delay-200">
                            Reliable transportation, warehousing, and supply chain management across South Africa and beyond.
                        </p>
                        <div className="animate-fadeInUp delay-500">
                            <a href="#categories" className="bg-accent hover:bg-white hover:text-primary text-white font-bold px-10 py-4 rounded-full transition-all duration-300 transform hover:scale-105 shadow-xl inline-block">Our Services</a>
                        </div>
                    </div>
                </section>
            );
        };

        // --- Services Component ---
        const Services = () => {
            const serviceItems = [
                { title: "Freight Trucking", desc: "Long-haul and local trucking with modern fleet and experienced drivers for reliable transportation.", img: "https://images.pexels.com/photos/2348359/pexels-photo-2348359.jpeg" },
                { title: "Warehousing", desc: "Secure storage solutions with 24/7 monitoring and climate-controlled facilities in Durban.", img: "https://images.pexels.com/photos/4481327/pexels-photo-4481327.jpeg" },
                { title: "Freight Clearing Agent", desc: "Streamlining your cargo clearance with fast, reliable freight forwarding solutions", img: "https://media.gettyimages.com/id/666377166/photo/commercial-docks-worker-examining-containers.jpg?s=2048x2048&w=gi&k=20&c=4rolfZezQTciFzqgPNf5pSClxbqpYjKyE2WyVubPyC8=" },
                { title: "Cargo Handling", desc: "Specialized handling for all cargo types with temperature-controlled options.", img: "https://images.pexels.com/photos/17311127/pexels-photo-17311127.jpeg" },
                { title: "Distribution Hub", desc: "Centralized logistics and distribution center for efficient supply chain management.", img: "https://images.pexels.com/photos/9716376/pexels-photo-9716376.jpeg" },
                { title: "Supply Chain", desc: "End-to-end logistics solutions with real-time tracking and optimization.", img: "https://images.pexels.com/photos/6169136/pexels-photo-6169136.jpeg" },
                { title: "Cross-border Logistics", desc: "Efficient transportation solutions across South Africa and neighboring countries.", img: "https://images.pexels.com/photos/4483773/pexels-photo-4483773.jpeg" },
                { title: "On Air Logistics", desc: "Specialized transport for heavy machinery and industrial equipment via aviation support.", img: "https://images.pexels.com/photos/67563/plane-aircraft-jet-airbase-67563.jpeg" },
                { title: "Temperature-controlled", desc: "Refrigerated trucks for perishable goods and sensitive cargo requiring specific climates.", img: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT_S1lNJMNhKI9b09eaAYCD8h0kgqWULgRQDw&s" }
            ];
            return (
                <section id="categories" className="py-24 bg-gray-50">
                    <div className="container mx-auto px-4">
                        <div className="text-center mb-16">
                            <h2 className="text-4xl font-bold text-primary inline-block relative pb-4 after:content-[''] after:absolute after:bottom-0 after:left-1/2 after:-translate-x-1/2 after:w-20 after:h-1 after:bg-accent after:rounded-full">Our Trucking Services</h2>
                        </div>
                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-10">
                            {serviceItems.map((item, idx) => (
                                <div key={idx} className="bg-white rounded-2xl overflow-hidden shadow-lg hover:shadow-2xl transition-all duration-500 transform hover:-translate-y-2 group border-t-4 border-secondary hover:border-accent">
                                    <div className="h-56 relative overflow-hidden bg-gray-200">
                                        <img 
                                          src={item.img} 
                                          alt={item.title} 
                                          className="w-full h-full object-cover transition-transform duration-700 group-hover:scale-110" 
                                          loading="eager" 
                                        />
                                    </div>
                                    <div className="p-8">
                                        <h3 className="text-xl font-bold text-primary mb-3 group-hover:text-secondary transition-colors">{item.title}</h3>
                                        <p className="text-gray-600 leading-relaxed">{item.desc}</p>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                </section>
            );
        };

        // --- Fleet Component ---
        const Fleet = () => {
            const fleetItems = [
                { icon: 'fa-truck', name: 'Freight Trucks' },
                { icon: 'fa-truck-loading', name: 'Flatbed Trailers' },
                { icon: 'fa-snowflake', name: 'Refrigerated Trucks' },
                { icon: 'fa-boxes', name: 'Container Carriers' },
                { icon: 'fa-weight-hanging', name: 'Heavy Haulage' },
                { icon: 'fa-warehouse', name: 'Warehouse Equipment' },
                { icon: 'fa-forklift', name: 'Forklifts' },
                { icon: 'fa-truck-pickup', name: 'Pickup Vehicles' },
                { icon: 'fa-shipping-fast', name: 'Express Delivery' },
                { icon: 'fa-satellite-dish', name: 'GPS Tracking' },
            ];
            return (
                <section id="brands" className="py-24 bg-gradient-to-br from-secondary to-primary text-white relative overflow-hidden">
                    <div className="absolute inset-0 opacity-10 pointer-events-none" style={{ backgroundImage: "url(\"data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.4'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E\")" }} />
                    <div className="container mx-auto px-4 relative z-10">
                        <div className="text-center mb-16">
                            <h2 className="text-4xl font-bold inline-block relative pb-4 after:content-[''] after:absolute after:bottom-0 after:left-1/2 after:-translate-x-1/2 after:w-20 after:h-1 after:bg-accent after:rounded-full">Our Fleet & Equipment</h2>
                        </div>
                        <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-6">
                            {fleetItems.map((item, idx) => (
                                <div key={idx} className="bg-white/10 backdrop-blur-md rounded-xl p-8 text-center transition-all duration-300 border border-white/10 hover:bg-white/20 hover:scale-105 hover:-translate-y-1 group">
                                    <div className="text-4xl text-accent mb-4 transition-transform duration-300 group-hover:scale-125 group-hover:rotate-12">
                                        <i className={`fas ${item.icon}`}></i>
                                    </div>
                                    <h3 className="text-sm font-semibold tracking-wide uppercase">{item.name}</h3>
                                </div>
                            ))}
                        </div>
                    </div>
                </section>
            );
        };

        // --- SpecializedServices Component ---
        const SpecializedServices = () => {
            const specs = [
                { icon: 'fa-route', title: 'Route Optimization', text: 'Advanced route planning for maximum efficiency and fuel savings.' },
                { icon: 'fa-map-marker-alt', title: 'Real-time Tracking', text: 'GPS tracking for complete visibility of your shipments 24/7.' },
                { icon: 'fa-shield-alt', title: 'Cargo Insurance', text: 'Comprehensive insurance coverage for all transported goods.' },
            ];
            return (
                <section id="services" className="py-24 bg-white">
                    <div className="container mx-auto px-4">
                        <div className="text-center mb-16">
                            <h2 className="text-4xl font-bold text-primary inline-block relative pb-4 after:content-[''] after:absolute after:bottom-0 after:left-1/2 after:-translate-x-1/2 after:w-20 after:h-1 after:bg-accent after:rounded-full">Specialized Services</h2>
                        </div>
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-8">
                            {specs.map((item, idx) => (
                                <div key={idx} className="bg-gray-50 rounded-2xl p-10 text-center shadow-md transition-all hover:shadow-xl hover:-translate-y-2 border-l-4 border-secondary hover:border-accent">
                                    <div className="text-5xl text-secondary mb-6 transition-colors hover:text-accent">
                                        <i className={`fas ${item.icon}`}></i>
                                    </div>
                                    <h3 className="text-xl font-bold text-primary mb-4">{item.title}</h3>
                                    <p className="text-gray-600 leading-relaxed">{item.text}</p>
                                </div>
                            ))}
                        </div>
                    </div>
                </section>
            );
        };

        // --- Leadership Component ---
        const Leadership = () => {
            return (
                <section id="leadership" className="py-24 bg-gray-50 overflow-hidden">
                    <div className="container mx-auto px-4">
                        <div className="grid grid-cols-1 lg:grid-cols-2 gap-16 items-center">
                            <div className="grid grid-cols-2 gap-6 order-2 lg:order-1">
                                <div className="rounded-2xl overflow-hidden shadow-2xl transform translate-y-8 animate-fadeInUp">
                                    <img src="PHOTO-2026-01-09-22-22-45.jpg" alt="CEO Hilda" className="w-full h-80 object-cover" loading="eager" />
                                </div>
                                <div className="rounded-2xl overflow-hidden shadow-2xl transform -translate-y-8 animate-fadeInUp delay-300">
                                    <img src="PHOTO-2026-01-09-22-22-45 (1).jpg" alt="Leadership Meeting" className="w-full h-80 object-cover" loading="eager" />
                                </div>
                            </div>
                            <div className="order-1 lg:order-2 space-y-6">
                                <div className="mb-4">
                                    <h2 className="text-4xl font-bold text-primary mb-2">Hilda Mthembu</h2>
                                    <h3 className="text-xl font-semibold text-secondary">Founder & CEO</h3>
                                </div>
                                <p className="text-gray-600 text-lg leading-relaxed">Our leadership team brings expertise and vision to Green Lane 101, ensuring we deliver exceptional logistics services to our clients.</p>
                                <p className="text-gray-600 text-lg leading-relaxed">With a commitment to reliability and efficiency, Green Lane 101 has established itself as a trusted partner in the trucking industry.</p>
                                <div className="bg-gradient-to-r from-secondary/10 to-accent/10 p-8 rounded-2xl border-l-4 border-accent relative italic">
                                    <span className="absolute top-0 left-4 text-6xl text-accent/20 font-serif">"</span>
                                    <p className="text-primary text-xl font-medium relative z-10">We don't just transport goods – we deliver promises. Every truck on the road represents our commitment to our clients' success.</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </section>
            );
        };

        // --- Reviews Component ---
        const ReviewCard = ({ review, theme }) => {
            const isDark = theme === 'dark';
            return (
                <div className={`rounded-2xl p-8 shadow-xl transition-all hover:-translate-y-2 group overflow-hidden relative ${isDark ? 'bg-gradient-to-br from-primary to-secondary text-white' : 'bg-white text-primary border-2 border-secondary'}`}>
                    <div className="flex items-center gap-4 mb-6 relative z-10">
                        <div className={`w-14 h-14 rounded-full flex items-center justify-center font-bold text-lg shadow-inner ${isDark ? 'bg-gradient-to-br from-accent to-white text-secondary' : 'bg-secondary text-white'}`}>
                            {review.avatar}
                        </div>
                        <div>
                            <h4 className="font-bold">{review.name}</h4>
                            <p className={`text-xs opacity-70 ${isDark ? 'text-white' : 'text-gray-500'}`}>{review.date}</p>
                        </div>
                    </div>
                    <div className="flex text-yellow-400 mb-4 relative z-10">
                        {[...Array(5)].map((_, i) => (
                            <i key={i} className={`${i < review.rating ? 'fas' : 'far'} fa-star mr-1`}></i>
                        ))}
                    </div>
                    <p className={`italic relative z-10 pl-4 border-l-2 ${isDark ? 'border-accent text-white/90' : 'border-secondary text-gray-700'}`}>"{review.text}"</p>
                    <div className={`absolute top-0 right-0 w-24 h-24 rounded-full -mr-8 -mt-8 opacity-10 ${isDark ? 'bg-white' : 'bg-secondary'}`} />
                </div>
            );
        };

        const Reviews = () => {
            const reviews = [
                { id: 1, name: "Thabo Ndlovu", date: "March 15, 2023", avatar: "TN", rating: 5, text: "Green Lane 101 has been our logistics partner for 3 years. Their reliability is unmatched. Our shipments always arrive on time." },
                { id: 2, name: "Sarah Johnson", date: "April 2, 2023", avatar: "SJ", rating: 4, text: "The warehouse facilities at 85 Livingstone Road are exceptional. Secure, clean, and well-organized. Green Lane handles our electronics with care." },
                { id: 3, name: "James Peterson", date: "February 28, 2023", avatar: "JP", rating: 5, text: "Their real-time tracking system gives us peace of mind. Professional drivers and excellent customer service from Hilda's team." },
                { id: 4, name: "Linda Mkhize", date: "May 10, 2023", avatar: "LM", rating: 5, text: "Consistent on-time deliveries and great communication from the Green Lane team. Highly recommended for logistics needs." },
                { id: 5, name: "Thomas King", date: "June 5, 2023", avatar: "TK", rating: 5, text: "Outstanding service! They helped our business with all our transportation needs. Quality service at competitive prices." },
                { id: 6, name: "Michael Smith", date: "July 18, 2023", avatar: "MS", rating: 4, text: "I've been a loyal customer for years. Their range of logistics services is unmatched. Staff always goes above and beyond." }
            ];
            return (
                <section id="reviews" className="py-24 bg-gray-100">
                    <div className="container mx-auto px-4">
                        <div className="text-center mb-16">
                            <h2 className="text-4xl font-bold text-primary inline-block relative pb-4 after:content-[''] after:absolute after:bottom-0 after:left-1/2 after:-translate-x-1/2 after:w-20 after:h-1 after:bg-accent after:rounded-full">Customer Reviews</h2>
                        </div>
                        <div className="hidden md:grid grid-cols-3 gap-8">
                            <div className="col-start-2"><ReviewCard review={reviews[0]} theme="dark" /></div>
                            <div className="col-span-3 grid grid-cols-2 gap-8 px-12">
                                <ReviewCard review={reviews[1]} theme="dark" />
                                <ReviewCard review={reviews[2]} theme="dark" />
                            </div>
                            <ReviewCard review={reviews[3]} theme="light" />
                            <ReviewCard review={reviews[4]} theme="light" />
                            <ReviewCard review={reviews[5]} theme="light" />
                        </div>
                        <div className="md:hidden space-y-6">
                            {reviews.map(r => <ReviewCard key={r.id} review={r} theme={r.id <= 3 ? "dark" : "light"} />)}
                        </div>
                    </div>
                </section>
            );
        };

        // --- FAQ Component ---
        const FAQ = () => {
            const [openIdx, setOpenIdx] = useState(null);
            const faqData = [
                { q: "What are your service areas?", a: "We provide trucking and logistics services across South Africa, with special focus on Durban, Johannesburg, Cape Town, and major port cities. We also handle cross-border transportation to neighboring countries." },
                { q: "Do you offer warehousing services?", a: "Yes, we offer secure warehousing at our facility at 85 Livingstone Road, Windemere, Durban 4001. Our warehouse features 24/7 security, climate control, and real-time inventory tracking." },
                { q: "Can you handle temperature-sensitive cargo?", a: "Absolutely! We have a fleet of refrigerated trucks and temperature-controlled storage facilities for perishable goods, pharmaceuticals, and other temperature-sensitive cargo." },
                { q: "Do you offer real-time tracking?", a: "Yes, all our trucks are equipped with GPS tracking. Clients receive real-time updates on their shipments and can track their cargo 24/7 through our online portal." },
                { q: "What payment methods do you accept?", a: "We accept cash, credit/debit cards, and bank transfers. For corporate accounts, we offer invoice-based payment options with flexible terms." },
            ];
            return (
                <section id="faq" className="py-24 bg-white">
                    <div className="container mx-auto px-4 max-w-3xl">
                        <div className="text-center mb-16">
                            <h2 className="text-4xl font-bold text-primary inline-block relative pb-4 after:content-[''] after:absolute after:bottom-0 after:left-1/2 after:-translate-x-1/2 after:w-20 after:h-1 after:bg-accent after:rounded-full">Frequently Asked Questions</h2>
                        </div>
                        <div className="space-y-4">
                            {faqData.map((item, idx) => (
                                <div key={idx} className={`rounded-xl border-l-4 transition-all duration-300 overflow-hidden ${openIdx === idx ? 'border-accent shadow-lg bg-gray-50' : 'border-secondary bg-gray-50 hover:bg-white hover:shadow'}`}>
                                    <button className="w-full flex items-center justify-between p-6 text-left font-semibold text-primary" onClick={() => setOpenIdx(openIdx === idx ? null : idx)}>
                                        <span>{item.q}</span>
                                        <i className={`fas fa-chevron-down transition-transform duration-300 ${openIdx === idx ? 'rotate-180 text-accent' : ''}`}></i>
                                    </button>
                                    <div className={`transition-all duration-300 ease-in-out ${openIdx === idx ? 'max-h-96 opacity-100 p-6 pt-0' : 'max-h-0 opacity-0 overflow-hidden'}`}>
                                        <p className="text-gray-600 border-t border-gray-200 pt-4 leading-relaxed">{item.a}</p>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                </section>
            );
        };

        // --- LocationMap Component ---
        const LocationMap = () => {
            return (
                <section id="location" className="py-24 bg-gray-50">
                    <div className="container mx-auto px-4">
                        <div className="text-center mb-16">
                            <h2 className="text-4xl font-bold text-primary inline-block relative pb-4 after:content-[''] after:absolute after:bottom-0 after:left-1/2 after:-translate-x-1/2 after:w-20 after:h-1 after:bg-accent after:rounded-full">Our Location</h2>
                        </div>
                        <div className="relative rounded-2xl overflow-hidden shadow-2xl h-[500px]">
                            <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3456.789012345678!2d31.028742!3d-29.8587!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x0%3A0x0!2zMjnCsDUxJzMxLjMiUyAzMcKwMDEnNDMuNCJF!5e0!3m2!1sen!2sza!4v1620000000000!5m2!1sen!2sza" width="100%" height="100%" style={{ border: 0 }} allowFullScreen={true} loading="lazy" title="Green Lane 101 Location" />
                            <div className="absolute bottom-10 left-10 hidden lg:block bg-secondary/95 backdrop-blur-lg text-white p-10 rounded-2xl max-w-sm border-l-8 border-accent shadow-2xl">
                                <h3 className="text-2xl font-bold text-accent mb-4">Visit Our Headquarters</h3>
                                <div className="space-y-3">
                                    <p className="flex items-start gap-3"><i className="fas fa-map-marker-alt text-accent mt-1"></i> 85 Livingstone Road, Windemere, Durban, 4001, SA</p>
                                    <p className="flex items-start gap-3"><i className="fas fa-clock text-accent mt-1"></i> Mon-Fri: 8AM-5PM, Sat: 9AM-1PM</p>
                                    <p className="flex items-start gap-3"><i className="fas fa-phone text-accent mt-1"></i> +27 (068) 429-4702</p>
                                    <p className="flex items-start gap-3"><i className="fas fa-envelope text-accent mt-1"></i> hilda@greenlane101.com</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </section>
            );
        };

        // --- Contact Component ---
        const Contact = () => {
            const [status, setStatus] = useState(null);
            const handleSubmit = (e) => {
                e.preventDefault();
                setStatus('sending');
                setTimeout(() => {
                    setStatus('success');
                    alert('Thank you for your message! Hilda will get back to you soon.');
                }, 1500);
            };
            return (
                <section id="contact" className="py-24 bg-gradient-to-br from-secondary to-primary text-white">
                    <div className="container mx-auto px-4">
                        <div className="grid grid-cols-1 lg:grid-cols-2 gap-16">
                            <div className="space-y-8">
                                <div><h2 className="text-4xl font-bold mb-6">Contact Us</h2><p className="text-white/80 text-lg">Have questions about our logistics solutions? Our team is ready to help you optimize your supply chain.</p></div>
                                <div className="space-y-6">
                                    <h3 className="text-2xl font-semibold text-accent">Get In Touch</h3>
                                    <div className="space-y-4">
                                        <div className="flex items-center gap-4 group">
                                            <div className="w-12 h-12 bg-white/10 rounded-full flex items-center justify-center group-hover:bg-accent transition-colors"><i className="fas fa-map-marker-alt"></i></div>
                                            <span>85 Livingstone Road, Windemere, Durban 4001</span>
                                        </div>
                                        <div className="flex items-center gap-4 group">
                                            <div className="w-12 h-12 bg-white/10 rounded-full flex items-center justify-center group-hover:bg-accent transition-colors"><i className="fas fa-phone"></i></div>
                                            <span>+27 (068) 429-4702</span>
                                        </div>
                                        <div className="flex items-center gap-4 group">
                                            <div className="w-12 h-12 bg-white/10 rounded-full flex items-center justify-center group-hover:bg-accent transition-colors"><i className="fas fa-envelope"></i></div>
                                            <span>hilda@greenlane101.com</span>
                                        </div>
                                    </div>
                                </div>
                                <div className="flex gap-4">
                                    {['facebook-f', 'twitter', 'instagram', 'linkedin-in'].map(social => (
                                        <a key={social} href="#" className="w-12 h-12 bg-white/10 rounded-full flex items-center justify-center hover:bg-accent hover:-translate-y-1 transition-all text-xl">
                                            <i className={`fab fa-${social}`}></i>
                                        </a>
                                    ))}
                                </div>
                            </div>
                            <form onSubmit={handleSubmit} className="bg-white/10 backdrop-blur-lg p-10 rounded-3xl border border-white/20 shadow-2xl">
                                <div className="space-y-4">
                                    <input type="text" placeholder="Your Name" required className="w-full bg-white/10 border border-white/20 rounded-xl px-6 py-4 outline-none focus:border-accent focus:bg-white/20 transition-all placeholder:text-white/60" />
                                    <input type="email" placeholder="Your Email" required className="w-full bg-white/10 border border-white/20 rounded-xl px-6 py-4 outline-none focus:border-accent focus:bg-white/20 transition-all placeholder:text-white/60" />
                                    <input type="text" placeholder="Subject" className="w-full bg-white/10 border border-white/20 rounded-xl px-6 py-4 outline-none focus:border-accent focus:bg-white/20 transition-all placeholder:text-white/60" />
                                    <textarea placeholder="Your Message" rows={5} required className="w-full bg-white/10 border border-white/20 rounded-xl px-6 py-4 outline-none focus:border-accent focus:bg-white/20 transition-all placeholder:text-white/60 resize-none"></textarea>
                                    <button type="submit" disabled={status === 'sending'} className="w-full bg-accent hover:bg-white hover:text-primary text-white font-bold py-4 rounded-xl transition-all shadow-xl disabled:opacity-50">
                                        {status === 'sending' ? 'Sending...' : 'Send Message'}
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                </section>
            );
        };

        // --- Footer Component ---
        const Footer = ({ logo }) => {
            return (
                <footer className="bg-secondary text-white py-16 border-t border-white/10">
                    <div className="container mx-auto px-4">
                        <div className="flex flex-col md:flex-row justify-between items-center gap-10 mb-12">
                            <div className="flex items-center gap-4">
                                <img src={logo} alt="Green Lane 101" className="h-16 w-auto object-contain" />
                                <div><h2 className="text-2xl font-bold">Green <span className="text-accent">Lane</span> 101</h2><p className="text-sm opacity-60">Trucking & Logistics Solutions</p></div>
                            </div>
                            <div className="flex flex-wrap justify-center gap-8 text-sm font-medium">
                                <a href="#" className="hover:text-accent transition-colors">Privacy Policy</a>
                                <a href="#" className="hover:text-accent transition-colors">Terms of Service</a>
                                <a href="#" className="hover:text-accent transition-colors">Sitemap</a>
                            </div>
                        </div>
                        <div className="pt-8 border-t border-white/5 text-center text-white/40 text-sm"><p>&copy; {new Date().getFullYear()} Green Lane 101 Trucking & Logistics. All rights reserved.</p></div>
                    </div>
                </footer>
            );
        };

        // --- Main App Component ---
        const App = () => {
            return (
                <div className="min-h-screen">
                    <Header logo={DEFAULT_LOGO} />
                    <main>
                        <Hero />
                        <Services />
                        <Fleet />
                        <SpecializedServices />
                        <Leadership />
                        <Reviews />
                        <FAQ />
                        <LocationMap />
                        <Contact />
                    </main>
                    <Footer logo={DEFAULT_LOGO} />
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
